[project]
name = "cronos-ai"
version = "0.1.0"
description = "Cronos AI is a local-first, human-supervised software delivery platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.8,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
cronos-ai = "cronos_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]
